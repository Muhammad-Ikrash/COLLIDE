<div class="auth-container">
  <div class="auth-card">
    <!-- Tab Bar -->
    <div class="tab-bar">
      <button 
        class="tab-button" 
        [class.active]="activeTab === 'login'"
        (click)="switchTab('login')">
        Login
      </button>
      <button 
        class="tab-button" 
        [class.active]="activeTab === 'signup'"
        (click)="switchTab('signup')">
        Sign Up
      </button>
    </div>

    <!-- Login Form -->
    <form *ngIf="activeTab === 'login'" class="auth-form" (ngSubmit)="onLogin(); $event.preventDefault()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="loginEmail"
          type="email"
          [(ngModel)]="loginForm.email"
          placeholder="Enter your email"
          required
        />
      </div>
      <div class="form-group">
        <div class="password-header">
          <label for="login-password">Password</label>
          <a routerLink="/auth/forgot-password" class="forgot-password-link">Forgot Password?</a>
        </div>
        <input
          id="login-password"
          name="loginPassword"
          type="password"
          [(ngModel)]="loginForm.password"
          placeholder="Enter your password"
          required
        />
      </div>
      <button type="submit" class="submit-button" [disabled]="isLoading">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>

    <!-- Sign Up Form -->
    <form *ngIf="activeTab === 'signup'" class="auth-form" (ngSubmit)="onSignup(); $event.preventDefault()">
      <div class="form-group">
        <label for="signup-name">Name</label>
        <input
          id="signup-name"
          name="signupName"
          type="text"
          [(ngModel)]="signupForm.name"
          placeholder="Enter your name"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input
          id="signup-email"
          name="signupEmail"
          type="email"
          [(ngModel)]="signupForm.email"
          placeholder="Enter your email"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input
          id="signup-password"
          name="signupPassword"
          type="password"
          [(ngModel)]="signupForm.password"
          placeholder="Enter your password"
          required
        />
      </div>
      <div class="form-group">
        <label for="signup-confirm-password">Confirm Password</label>
        <input
          id="signup-confirm-password"
          name="signupConfirmPassword"
          type="password"
          [(ngModel)]="signupForm.confirmPassword"
          placeholder="Confirm your password"
          required
        />
      </div>
      <button type="submit" class="submit-button" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    </form>
  </div>
</div>
