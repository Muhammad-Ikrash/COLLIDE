<div class="account-container">
    <div class="account-card">
        <div class="card-header">
            <button class="back-btn" (click)="goBack()">← Back</button>
            <h2>Account Information</h2>
        </div>

        <div class="form-section">
            <h3>Profile</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" [value]="email" disabled class="input-disabled">
                <small>Email cannot be changed</small>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" [(ngModel)]="username" placeholder="Enter username">
            </div>
            <button class="btn-primary" (click)="updateProfile()" [disabled]="isLoading">
                Update Profile
            </button>
        </div>

        <div class="divider"></div>

        <div class="form-section">
            <h3>Change Password</h3>
            <div class="form-group">
                <label>Old Password</label>
                <input type="password" [(ngModel)]="oldPassword" placeholder="Current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" [(ngModel)]="newPassword" placeholder="New password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" [(ngModel)]="confirmPassword" placeholder="Retype new password">
            </div>
            <button class="btn-secondary" (click)="updatePassword()" [disabled]="isLoading">
                Change Password
            </button>
        </div>

        <div class="status-message" *ngIf="message || error">
            <p class="success" *ngIf="message">{{ message }}</p>
            <p class="error" *ngIf="error">{{ error }}</p>
        </div>
    </div>
</div>
