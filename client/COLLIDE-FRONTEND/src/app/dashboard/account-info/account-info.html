<div class="account-page">
    <!-- Header -->
    <div class="page-header">
        <button class="back-link" (click)="goBack()">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back to Dashboard
        </button>
        <div class="page-title">
            <h1>Account Management</h1>
            <p>Manage your account settings and security</p>
        </div>
    </div>

    <!-- Account Information Section -->
    <div class="section-card">
        <div class="section-header">
            <svg class="section-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>Account Information</span>
        </div>
        <div class="info-grid">
            <div class="info-item">
                <label>Current Username</label>
                <div class="info-value">{{ username || 'Not set' }}</div>
            </div>
            <div class="info-item">
                <label>Email Address</label>
                <div class="info-value with-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    {{ email }}
                </div>
            </div>
        </div>
    </div>

    <!-- Change Username Section -->
    <div class="section-card">
        <div class="section-header">
            <svg class="section-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>Change Username</span>
        </div>
        <div class="form-content">
            <div class="form-group">
                <label>New Username</label>
                <input type="text" [(ngModel)]="newUsername" placeholder="Enter new username">
            </div>
            <button class="btn-primary" (click)="updateUsername()" [disabled]="isLoading || !newUsername?.trim()">
                Update Username
            </button>
        </div>
    </div>

    <!-- Change Password Section -->
    <div class="section-card">
        <div class="section-header">
            <svg class="section-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <span>Change Password</span>
        </div>
        <div class="form-content">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" [(ngModel)]="oldPassword" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm new password">
            </div>
            <div class="button-row">
                <button class="btn-primary" (click)="updatePassword()" [disabled]="isLoading">
                    Change Password
                </button>
                <button class="btn-secondary" (click)="resetPasswordFields()">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    Reset Password
                </button>
            </div>
        </div>
    </div>

    <!-- Status Messages -->
    @if (message || error) {
    <div class="toast" [class.success]="message" [class.error]="error">
        {{ message || error }}
        <button class="toast-close" (click)="clearMessages()">×</button>
    </div>
