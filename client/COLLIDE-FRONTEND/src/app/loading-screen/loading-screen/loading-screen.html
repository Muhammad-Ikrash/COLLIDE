<div class="loading-screen">
  <div class="loading-content">
    <div class="logo" aria-hidden="true">
      <span class="word coll"><span class="inner">COLL</span></span>
      <span class="word ide"><span class="inner">IDE</span></span>
    </div>

    <p class="loading-sub">Loading your collaborative IDE...</p>

    <!-- Temporary theme toggle for testing (keep or remove later) -->
    <button 
      (click)="toggleTheme()" 
      class="theme-toggle">
      Toggle Theme (Current: {{ themingService.getCurrentTheme() }})
    </button>
  </div>
</div>
