<div class="file-explorer-container">
    <div *ngIf="!rootPath" class="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48" style="fill: rgba(168, 85, 247, 0.3); margin-bottom: 12px;">
            <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
        </svg>
        <p>No folder opened</p>
        <button (click)="openFolder()">Open Folder</button>
    </div>
    <div *ngIf="rootPath" class="tree-content">
        <div class="tree-root" *ngIf="tree() as t; else loading">
            <file-node [node]="t" [level]="0"
                (open)="open($event.path,$event.name)"
                (rename)="onRename($event)"
                (delete)="onDelete($event)"
                (create)="onCreate($event)"
            ></file-node>
        </div>
        <ng-template #loading>
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Loading files...</span>
            </div>
        </ng-template>
    </div>
</div>
