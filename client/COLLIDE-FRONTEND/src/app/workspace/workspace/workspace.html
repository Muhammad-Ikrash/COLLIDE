<div class="workspace-container">
    <div class="workspace-header">
        <app-workspace-header></app-workspace-header>
    </div>
    <div class="chat-sidebar">
        <app-chat-sidebar></app-chat-sidebar>
    </div>
    <div class="file-explorer">
        <app-file-explorer (rootPathChange)="onRootPathChange($event)"></app-file-explorer>
    </div>
    <div class="file-tabs">
        <app-file-tabs></app-file-tabs>
    </div>
    <div class="ide-editor">
        <app-ide-editor></app-ide-editor>
    </div>
    <div class="ide-footer">
        <app-ide-footer></app-ide-footer>
    </div>
    <div class="terminal">
        @if (projectRootPath) {
            <app-terminal [terminalPath]="projectRootPath"></app-terminal>
        }
        <!-- <app-terminal *ngIf="projectRootPath" [terminalPath]="projectRootPath"></app-terminal> -->
         <!-- <app-terminal></app-terminal> -->
    </div>
</div>
