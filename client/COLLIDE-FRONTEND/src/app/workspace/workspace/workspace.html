@if (!isLoading && !error) {
<div class="workspace-container">
    <div class="workspace-header"> 
        <app-workspace-header></app-workspace-header>
    </div>
    <div class="chat-sidebar">
        <app-chat-sidebar></app-chat-sidebar>
    </div>
    <div class="file-explorer"> 
        <app-file-explorer></app-file-explorer>
    </div>
    <div class="file-tabs"> 
        <app-file-tabs></app-file-tabs>
    </div>
    <div class="ide-editor">
        <app-ide-editor></app-ide-editor>
    </div>
    <div class="ide-footer"> 
        <app-ide-footer></app-ide-footer>
    </div>
    <div class="terminal">
        @if (projectRootPath) {
            <app-terminal [terminalPath]="projectRootPath"></app-terminal>
        }
    </div>
</div>
}

<!-- Loading State -->
@if (isLoading) {
<div class="workspace-loading">
    <div class="loading-content">
        <div class="spinner"></div>
        <p>Loading workspace...</p>
    </div>
</div>
}

<!-- Error State -->
@if (error) {
<div class="workspace-error">
    <div class="error-content">
        <span class="error-icon">⚠️</span>
        <h2>Failed to Load Workspace</h2>
        <p>{{ error }}</p>
        <button (click)="goToDashboard()">Back to Dashboard</button>
    </div>
</div>
}
