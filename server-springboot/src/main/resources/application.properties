
spring.application.name=server-springboot

# Database Configuration
# If DB_POOLER environment variable is set, use PostgreSQL (Supabase)
# Otherwise, use H2 in-memory database for local testing
spring.datasource.url=${DB_POOLER:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Disable data.sql since we use DataInitializer (programmatic approach is more reliable)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# H2 Console (for local testing - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

